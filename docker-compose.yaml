services:
  accounts:
    image: "andrewdark/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - darknet
  loans:
    image: "andrewdark/loans:s4"
    container_name: loans-ms
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - darknet
  cards:
    image: "andrewdark/cards:s4"
    container_name: cards-ms
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - darknet
networks:
  darknet:
    driver: "bridge"